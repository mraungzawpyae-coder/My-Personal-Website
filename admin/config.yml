backend:
  name: github
  repo: mraungzawpyae-coder/My-Personal-Website
  branch: main
  base_url: https://decap-oauth.mraungzawpyae.workers.dev
  auth_endpoint: /auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { 
          label: "Category", 
          name: "category", 
          widget: "select", 
          options: ["Tech", "Design", "Tutorial", "News", "Book", "General"],
          default: "General" 
        }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
